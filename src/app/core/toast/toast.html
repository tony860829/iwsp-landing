@if (toast.toasts().length > 0) {
  <div class="toasts">
    @for (item of toast.toasts(); track item.id) {
      <div class="toast toast--{{ item.type }}" role="alert">
        @if (item.type === 'success') {
          <svg class="toast__icon" viewBox="0 0 24 24" width="18" height="18" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6L9 17l-5-5" />
          </svg>
        } @else {
          <svg class="toast__icon" viewBox="0 0 24 24" width="18" height="18" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 8v4M12 16h.01" />
          </svg>
        }
        <p class="toast__message">{{ item.message }}</p>
        <button
          type="button"
          class="toast__close"
          [attr.aria-label]="'errors.dismiss' | transloco"
          (click)="toast.dismiss(item.id)"
        >
          &times;
        </button>
      </div>
    }
  </div>
}
