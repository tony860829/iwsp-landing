<section class="section">
  <div class="container">
    <header class="audience__head">
      <span class="section-kicker">Who we help</span>
      <h2 class="section-title">For whom is it essential to have a website</h2>
    </header>

    <div class="audience__grid">
      @for (item of audiences; track item.title) {
        <article class="audience__card">
          <h3>{{ item.title }}</h3>
          <p>{{ item.text }}</p>
        </article>
      }
    </div>
  </div>
</section>
