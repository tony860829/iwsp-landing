<section class="section section--light">
  <div class="container">
    <header class="team__head">
      <span class="section-kicker">{{ 'home.team.kicker' | transloco }}</span>
      <h2 class="section-title">{{ 'home.team.title' | transloco }}</h2>
      <p class="section-subtitle">{{ 'home.team.subtitle' | transloco }}</p>
    </header>

    <div class="team__grid">
      @for (crew of crews; track crew.title) {
        <article class="team__card">
          <figure class="team__media">
            <span class="team__initials">{{ crew.initials }}</span>
            <img [src]="crew.image" [alt]="crew.title | transloco" loading="lazy" (error)="($any($event.target)).style.display = 'none'" />
          </figure>
          <div class="team__body">
            <h3>{{ crew.title | transloco }}</h3>
            <p>{{ crew.text | transloco }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
